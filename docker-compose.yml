services:
  postgres:
    image: postgres:16-alpine
    container_name: atm-hse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atm_hse
      POSTGRES_PASSWORD: atm_hse_dev_password
      POSTGRES_DB: atm_hse_academy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
